      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: |
          SDKMGR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses --sdk_root="$ANDROID_SDK_ROOT" >/dev/null || true
          yes | "$SDKMGR" --install "ndk;26.1.10909125" --sdk_root="$ANDROID_SDK_ROOT"
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> SDL/android-project/local.properties

